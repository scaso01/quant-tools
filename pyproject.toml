[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-tools"
version = "0.1.0"
description = "Quantitative finance toolkit for retail market analysis"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.36",
    "fredapi>=0.5.2",
    "pandas>=2.1.0",
    "numpy>=2.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "textual>=0.85.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    # Floor is st.iframe, which replaced the deprecated st.components.v1.html.
    "streamlit>=1.60.0,<2.0.0",
    "streamlit-searchbox>=0.1.14",
    # Multi-asset data providers
    "ccxt>=4.0.0",
    "pandas-datareader>=0.10.0",
    "cot-reports>=0.1.0",
    # Portfolio optimization + Monte Carlo
    "cvxpy>=1.4.0",
    "pyportfolioopt>=1.5.5",
    # SEC filings
    "sec-edgar-downloader>=5.1.0",
    "edgartools>=0.30.0",
    # Reddit sentiment
    "praw>=7.7.0",
    # Regime detection
    "hmmlearn>=0.3.0",
]

[project.optional-dependencies]
ml = [
    # Classical and gradient-boosted forecasters. Capped at Python 3.13:
    # pandas-ta pulls in numba, which has no 3.14 wheel and fails to build.
    "pandas-ta>=0.3.14b",
    "lightgbm>=4.0.0",
    "statsforecast>=1.7.0",
    "prophet>=1.1.5",
    "arch>=7.0.0",
]
ml-neural = [
    # TFT, PatchTST, N-HiTS and LSTM. Split out of [ml] because neuralforecast
    # requires ray, whose newest release ships Windows wheels only up to
    # Python 3.12 (Linux and macOS go to 3.14). Bundled into [ml] it took the
    # whole extra down on Windows 3.13. Each model already reports itself
    # unavailable when the import fails, so skipping this costs no crash.
    "neuralforecast>=1.7.0",
]
docs = [
    # Document parsing (torch dependency — isolate from neuralforecast)
    "docling>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pyflakes>=3.2.0",
]
e2e = [
    "pytest-playwright>=0.5.0",
    "playwright>=1.40.0",
]
foundation = [
    # Moirai (uni2ts) is left out on purpose: it pins numpy~=1.26 while this
    # project needs numpy>=2, so listing it made the extra unresolvable.
    # MoiraiModel already reports itself unavailable when the import fails.
    "chronos-forecasting>=1.0.0",
    "timesfm>=2.0.0",
]
nlp = [
    "transformers>=4.35.0",
]
realtime = [
    # alpaca-py, not alpaca-trade-api: the older SDK pins websockets<11 against
    # Streamlit's >=12, so it could never be installed beside the dashboard.
    # websockets and python-binance were listed here but never imported.
    "alpaca-py>=0.21.0",
]
reports = [
    "fpdf2>=2.7.0",
]
alt-data = [
    # Published on PyPI as "gdelt"; gdeltPyR is only the repo name.
    "gdelt>=0.1.14",
    "pytrends>=4.9.0",
    # dbnomics removed — AGPL-3.0; module uses httpx REST API directly
    "mwviews>=0.1.0",
    # sdmx1 dropped: nothing imports it, and the pinned >=5.0.0 has never
    # existed (2.26 is the newest release), so this extra could not resolve.
    # The ECB module talks to the SDMX REST endpoint over httpx directly.
    "pycoingecko>=3.0.0",
    "fear-and-greed>=0.1.0",
]

[project.scripts]
quant-tools = "quant_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_tools = ["data/universes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "dashboard: Dashboard regression tests (hit live Streamlit server)",
    "e2e: End-to-end Playwright browser tests (require running Streamlit server)",
]
