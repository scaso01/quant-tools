version: 2
updates:
  # uv re-solves ci/uv.lock as a whole, so one update cannot clash with another package's needs.
  - package-ecosystem: uv
    directory: /ci
    schedule:
      interval: monthly
    allow:
      # The default covers only the packages ci/pyproject.toml names; this updates all of the lock.
      - dependency-type: all
    groups:
      all-dependencies:
        patterns: ["*"]
    ignore:
      # pyproject caps streamlit below 2; without this Dependabot widens the cap.
      - dependency-name: streamlit
        update-types: ["version-update:semver-major"]
