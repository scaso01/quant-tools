name: Newest libraries

# CI pins versions (requirements-ci.txt). This weekly run installs the newest allowed
# versions instead, so a release that breaks a fresh install shows up within a week.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" arch
      - run: python -m pyflakes src tests
      - run: python -m pytest tests/ -q --ignore=tests/e2e
