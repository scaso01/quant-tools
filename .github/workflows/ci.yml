name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: pyflakes
        # The repo carried 100 findings before this gate existed, mostly dead
        # imports. They were cleared in one pass; this is what stops them
        # accumulating again.
        run: python -m pyflakes src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All four verified green in containers before this workflow was written.
        # 3.14 has no manylinux wheel for hmmlearn yet and builds it from source,
        # which needs a compiler. Runner images ship one; a bare python:3.14-slim
        # does not, so that is the failure to expect if this ever goes red.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        # tests/conftest.py blocks requests, httpx, urllib, yfinance and fredapi,
        # so this suite never touches the network.
        run: python -m pytest tests/ -q --ignore=tests/e2e

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,e2e]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start the dashboard
        # QUANT_TOOLS_OFFLINE swaps yfinance for a seeded generator. The browser
        # drives a real server in its own process, so the in-process guards used
        # by the unit suite do not reach it and without this the run would depend
        # on a live market feed.
        env:
          QUANT_TOOLS_OFFLINE: "1"
        run: |
          python -m streamlit run src/quant_tools/dashboard/app.py \
            --server.port 8599 --server.headless true &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8599/_stcore/health >/dev/null; then
              echo "dashboard is up"; exit 0
            fi
            sleep 2
          done
          echo "dashboard failed to start"; exit 1
      - name: Playwright tests
        env:
          STREAMLIT_E2E_URL: http://localhost:8599
        run: python -m pytest tests/e2e -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Nothing is pushed. The point is to catch a Dockerfile that stopped
          # building, which is easy to miss when the extras it installs change.
          push: false
          load: true
          tags: quant-tools:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        # A build that succeeds but produces an image whose entry point cannot
        # import is still broken, so exercise the CLI rather than trusting the
        # layer count.
        run: docker run --rm quant-tools:ci quant-tools --help
